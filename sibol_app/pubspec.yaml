name: sibol_app
description: "SIBOL — fictional adolescent pregnancy monitoring prototype (Barangay 3 demo)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  cloud_functions: ^7.0.0
  intl: ^0.20.3
  equatable: ^2.0.5
  connectivity_plus: ^6.1.4
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/sibol_app_icon_source.png
  remove_alpha_ios: true
  adaptive_icon_background: "#5BC8F5"
  adaptive_icon_foreground: assets/branding/sibol_app_icon_source.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/sibol_logo.png
    - assets/geo/psgc-synthetic-demo-v1.json
    - assets/geo/psgc-psa-2025-2q.json
    - assets/geo/nhfr-synthetic-demo-v1.json
